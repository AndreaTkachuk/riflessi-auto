name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/riflessi/api:${{ github.sha }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile --filter @riflessi/api...

      - name: Database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
        run: pnpm prisma migrate deploy

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build -f apps/api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy riflessi-api \
            --image "$IMAGE" \
            --region ${{ vars.GCP_REGION }} \
            --service-account riflessi-api@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-secrets DATABASE_URL=database-url:latest \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --memory 512Mi
